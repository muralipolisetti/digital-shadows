version: '3.8'

services:
  sentinel-x:
    build: .
    container_name: sentinel-x-soc
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - SENTINEL_SECRET=sentinel-docker-range-2026
    volumes:
      - sentinel-data:/app/backend
    restart: unless-stopped

volumes:
  sentinel-data:
